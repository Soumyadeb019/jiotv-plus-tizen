<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JioTV+ Tizen</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #131822;
      border-bottom: 2px solid #1f2937;
    }
    .brand { font-size: 26px; font-weight: bold; color: #e11d48; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-left: 12px;
      background: #374151;
      color: #f3f4f6;
    }
    .legend span { margin-left: 18px; font-size: 15px; color: #9ca3af; }
    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .grid-container {
      padding: 28px 40px;
      height: calc(100vh - 85px);
      overflow-y: hidden;
    }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-gap: 20px;
    }
    .card {
      background: #1a2130;
      border: 3px solid transparent;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .card.focused {
      border-color: #38bdf8;
      background: #232d42;
      transform: scale(1.05);
    }
    .card img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-num { font-size: 12px; color: #38bdf8; margin-bottom: 4px; }

    /* Fullscreen Player Overlay */
    #player-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 100;
    }
    video { width: 100%; height: 100%; }
    #player-status {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(19, 24, 34, 0.95);
      border: 2px solid #38bdf8;
      padding: 24px 36px;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
      z-index: 115;
      max-width: 80vw;
    }
    #osd-banner {
      position: fixed;
      bottom: 40px; left: 40px; right: 40px;
      background: rgba(19, 24, 34, 0.92);
      border-left: 6px solid #e11d48;
      padding: 18px 28px;
      border-radius: 8px;
      font-size: 22px;
      z-index: 110;
      display: none;
    }

    /* TV Remote Login Modal */
    #login-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      background: #1a2130;
      border: 2px solid #e11d48;
      border-radius: 12px;
      padding: 32px;
      width: 520px;
      text-align: center;
    }
    .modal-title { font-size: 24px; margin-bottom: 12px; color: #fff; }
    .modal-sub { font-size: 15px; color: #9ca3af; margin-bottom: 20px; }
    .input-display {
      background: #0b0e14;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      font-size: 28px;
      letter-spacing: 4px;
      color: #38bdf8;
      min-height: 62px;
      margin-bottom: 18px;
    }
    .modal-hint { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
    #num-osd {
      position: fixed;
      top: 40px; right: 50px;
      background: rgba(225, 29, 72, 0.9);
      padding: 12px 24px;
      font-size: 30px;
      font-weight: bold;
      border-radius: 8px;
      z-index: 120;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      JioTV+
      <span id="filter-label" style="font-size:17px; color:#38bdf8; margin-left:10px;">All Channels</span>
      <span id="service-badge" class="badge">Checking Service...</span>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#ef4444;"></i>Red: Login</span>
      <span><i class="dot" style="background:#22c55e;"></i>Green: Language</span>
      <span>Ch ▲/▼: Surf</span>
    </div>
  </div>

  <div class="grid-container" id="scroll-box">
    <div class="channel-grid" id="grid"></div>
  </div>

  <div id="player-overlay">
    <video id="tv-video" autoplay></video>
    <div id="player-status">Loading stream...</div>
    <div id="osd-banner"></div>
  </div>

  <div id="login-modal">
    <div class="modal-box">
      <div class="modal-title" id="login-title">Jio Login - Step 1</div>
      <div class="modal-sub" id="login-sub">Use your remote's 0-9 number buttons to enter your 10-digit mobile number:</div>
      <div class="input-display" id="login-input">_</div>
      <div class="modal-hint">
        Press <b>0-9</b> to type | Press <b>Left Arrow</b> to backspace<br>
        Press <b>Enter (OK)</b> to submit | Press <b>Back</b> to cancel
      </div>
    </div>
  </div>

  <div id="num-osd"></div>

  <script src="app.js"></script>
</body>
</html>
